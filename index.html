<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MEGA CHAMELEON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1D1B18; --ink-soft:#6B6862;
    --paper:#F2EFE6; --card:#FFFFFF; --card-2:#F7F4EC;
    --line:#DDD8C9; --line-2:#C7C1AE;
    --brand:#111111;
    --hot:#FF3E7F; --lime:#8BE04A; --sky:#3FC1F0; --sun:#FFC93C; --grape:#9B6BE8;
    --blank:#F4F1E8;
    --r:20px;
    --tap:56px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; overscroll-behavior:none; }
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Baloo 2','Apple SD Gothic Neo',sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    touch-action:manipulation;
  }
  h1,h2,h3{ margin:0; font-weight:700; }
  .app{ max-width:1180px; margin:0 auto; padding:14px 20px 40px; padding-bottom:calc(40px + env(safe-area-inset-bottom)); }

  /* ---- top bar ---- */
  .bar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand img{ height:44px; display:block; }
  .brand .wordmark{ font-size:1.35rem; font-weight:800; letter-spacing:-0.01em; line-height:1; }
  .brand .wordmark span{ display:block; font-size:0.72rem; font-weight:600; color:var(--ink-soft); letter-spacing:0.16em; }

  /* ---- buttons: all touch-sized ---- */
  .btn{
    font-family:inherit; font-size:1.05rem; font-weight:700; color:#fff; background:var(--ink);
    border:none; border-radius:16px; padding:0 26px; min-height:var(--tap); cursor:pointer;
    box-shadow:0 5px 0 #000; transition:transform .06s, box-shadow .06s;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:active{ transform:translateY(4px); box-shadow:0 1px 0 #000; }
  .btn.ghost{ background:var(--card); color:var(--ink); border:3px solid var(--ink); box-shadow:0 5px 0 var(--line-2); }
  .btn.ghost:active{ box-shadow:0 1px 0 var(--line-2); }
  .btn.hot{ background:var(--hot); box-shadow:0 5px 0 #C42B60; }
  .btn.hot:active{ box-shadow:0 1px 0 #C42B60; }
  .btn.lg{ font-size:1.4rem; min-height:72px; padding:0 44px; border-radius:20px; }
  .btn:disabled{ opacity:.4; }
  .linkbtn{
    background:none; border:none; font-family:inherit; font-size:1rem; font-weight:600; color:var(--ink-soft);
    min-height:var(--tap); padding:0 14px; cursor:pointer; border-radius:14px;
  }
  .linkbtn:active{ background:var(--card-2); }
  .row{ display:flex; gap:14px; align-items:center; }
  .row.end{ justify-content:flex-end; }
  .spacer{ flex:1; }

  .card{ background:var(--card); border:3px solid var(--ink); border-radius:var(--r); padding:20px; }

  section.step{ display:none; }
  section.step.active{ display:block; }
  .hidden{ display:none !important; }
  #admin-gate, #admin-dash{ display:block; }

  /* ---- home ---- */
  #home{ text-align:center; padding-top:12px; }
  #home .stage-art{ width:min(340px,72vw); margin:0 auto; display:block; }
  .title-art{ width:min(560px,92%); margin:4px auto 10px; display:block; }
  #home p{ color:var(--ink-soft); font-size:1.1rem; margin:0 auto 22px; max-width:520px; line-height:1.55; }

  /* ---- background picker: big tap tiles ---- */
  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px; margin-top:16px; }
  .tile{
    border:3px solid var(--ink); border-radius:18px; overflow:hidden; cursor:pointer; background:var(--card);
    padding:0; position:relative; transition:transform .08s;
  }
  .tile:active{ transform:scale(.97); }
  .tile .thumb{ height:130px; overflow:hidden; }
  .tile .thumb > *{ width:100%; height:130px; object-fit:cover; display:block; }
  .tile .tname{ padding:12px 10px; font-size:1.05rem; font-weight:700; text-align:center; }
  .tile.selected{ box-shadow:0 0 0 5px var(--hot); }
  .tile.selected .tname{ background:var(--hot); color:#fff; }

  /* ---- create stage ---- */
  .stage{
    position:relative; width:100%; aspect-ratio:4/3; border-radius:18px; overflow:hidden;
    border:3px solid var(--ink); background:#ccc; touch-action:none;
  }
  .bg-layer{ width:100%; height:100%; display:block; object-fit:cover; }
  .stage.eyedrop{ cursor:crosshair; }
  .viewport{ position:absolute; inset:0; transform-origin:0 0; }
  .char-anchor{ position:absolute; width:0; height:0; left:0; top:0; }
  .char-inner{ position:absolute; width:260px; height:340px; left:0; top:0; transform:translate(-50%,-50%) scale(.2); transform-origin:center center; touch-action:none; }
  .char-inner canvas{ width:260px; height:340px; display:block; touch-action:none; }
  .drag-handle{
    position:absolute; left:0; top:0; transform:translate(-50%,-165%);
    width:52px; height:52px; border-radius:50%; background:#fff; border:4px solid var(--ink);
    display:flex; align-items:center; justify-content:center; cursor:grab; touch-action:none; z-index:5;
    box-shadow:0 3px 0 rgba(0,0,0,.3);
  }
  .drag-handle svg{ width:26px; height:26px; display:block; }
  .zoom-badge{
    position:absolute; right:12px; bottom:12px; background:rgba(0,0,0,.62); color:#fff;
    font-size:.85rem; font-weight:600; padding:7px 12px; border-radius:12px; pointer-events:none;
  }
  .hint{ text-align:center; color:var(--ink-soft); font-size:.98rem; margin:12px 0 0; }
  .roundinfo{ font-size:1rem; color:var(--ink-soft); margin:2px 0 14px; font-weight:600; }

  /* ---- paint dock: iPad two-column ---- */
  /* ---- work area: stage left, tools right (stacks only on narrow phones) ---- */
  .workarea{ display:flex; gap:20px; align-items:flex-start; margin-top:4px; }
  .stagecol{ flex:1.5 1 0; min-width:0; }
  .toolcol{ flex:1 1 300px; max-width:340px; }
  @media (max-width:680px){ .workarea{ flex-direction:column; } .toolcol{ max-width:none; width:100%; } }
  .dockblock h3{ font-size:.95rem; color:var(--ink-soft); margin-bottom:9px; letter-spacing:.02em; }

  .swatches{ display:grid; grid-template-columns:repeat(auto-fit,minmax(46px,1fr)); gap:9px; }
  .swatch{ height:46px; border-radius:12px; border:3px solid rgba(0,0,0,.16); cursor:pointer; }
  .swatch.active{ border-color:var(--ink); box-shadow:0 0 0 4px var(--sun); }
  .pickrow{ display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  input[type=color]{ width:var(--tap); height:var(--tap); border:none; border-radius:14px; background:none; padding:0; cursor:pointer; }
  .poses{ display:flex; gap:10px; flex-wrap:wrap; }
  .posebtn{ border:3px solid var(--ink); border-radius:14px; background:var(--card); width:78px; padding:5px; cursor:pointer; }
  .posebtn svg{ width:100%; height:62px; display:block; }
  .posebtn .pn{ font-size:.78rem; font-weight:700; text-align:center; margin-top:2px; }
  .posebtn.selected{ background:var(--sun); box-shadow:0 0 0 4px rgba(255,201,60,.45); }
  .sizerow{ display:flex; align-items:center; gap:14px; }
  input[type=range]{ flex:1; height:var(--tap); accent-color:var(--hot); }
  .sizedot{ border-radius:50%; background:var(--ink); flex-shrink:0; }
  .toolrow{ display:flex; gap:10px; flex-wrap:wrap; }
  .toolbtn{
    font-family:inherit; font-weight:700; font-size:.98rem; min-height:var(--tap); padding:0 18px;
    border-radius:14px; border:3px solid var(--ink); background:var(--card); cursor:pointer;
  }
  .toolbtn.on{ background:var(--ink); color:#fff; }
  .nameinput{
    width:100%; min-height:var(--tap); padding:0 16px; border-radius:14px; border:3px solid var(--ink);
    font-family:inherit; font-size:1.15rem; font-weight:700; background:var(--card);
  }
  .warn{ color:var(--hot); font-size:.9rem; font-weight:700; min-height:18px; margin-top:6px; }

  /* ---- saved ---- */
  #saved-step{ text-align:center; }
  #saved-step .yay{ width:110px; margin:6px auto 12px; display:block; }
  #saved-step h2{ font-size:1.7rem; }
  #saved-step p{ color:var(--ink-soft); font-size:1.05rem; margin:10px 0 24px; }

  /* ---- admin ---- */
  #admin-gate .card{ max-width:420px; margin:50px auto; text-align:center; }
  #admin-gate input{ width:100%; min-height:var(--tap); padding:0 16px; border-radius:14px; border:3px solid var(--ink); font-family:inherit; font-size:1.4rem; text-align:center; letter-spacing:.3em; margin:16px 0 4px; }
  .subtabs{ display:flex; gap:10px; margin-bottom:16px; }
  .subtab{ min-height:var(--tap); padding:0 22px; display:flex; align-items:center; border-radius:14px; border:3px solid var(--ink); background:var(--card); font-weight:700; cursor:pointer; }
  .subtab.active{ background:var(--ink); color:#fff; }
  .bgtabs{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .bgtab{ min-height:48px; padding:0 18px; display:flex; align-items:center; border-radius:12px; border:3px solid var(--ink); background:var(--card); font-weight:700; cursor:pointer; }
  .bgtab.active{ background:var(--lime); }
  .adminwrap{ display:grid; grid-template-columns:1fr 260px; gap:18px; align-items:start; }
  @media (max-width:900px){ .adminwrap{ grid-template-columns:1fr; } }
  .adminlist{ display:flex; flex-direction:column; gap:10px; }
  .aitem{ display:flex; gap:12px; align-items:center; border:3px solid var(--ink); border-radius:14px; background:var(--card); padding:9px; cursor:pointer; min-height:var(--tap); }
  .aitem img{ width:38px; height:50px; object-fit:contain; }
  .aitem.sel{ background:var(--sun); }
  .aname{ font-weight:700; font-size:1rem; }
  .atime{ font-size:.8rem; color:var(--ink-soft); font-weight:600; }
  .atoken{ position:absolute; width:6.25%; transform:translate(-50%,-50%); pointer-events:none; }
  .atoken img{ width:100%; display:block; }
  .atoken.hi{ animation:pop 1s ease-in-out infinite; }
  @keyframes pop{ 0%,100%{ filter:drop-shadow(0 0 3px var(--sun)); } 50%{ filter:drop-shadow(0 0 12px var(--sun)); } }
  .empty{ color:var(--ink-soft); text-align:center; padding:24px; font-weight:600; }
  .bgman{ display:flex; flex-direction:column; gap:14px; }
  .bgrow{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; border:3px solid var(--ink); border-radius:16px; background:var(--card); padding:12px; }
  .bgrow .bgthumb{ width:170px; height:106px; border-radius:10px; overflow:hidden; border:3px solid var(--ink); flex-shrink:0; }
  .bgrow .bgthumb > *{ width:100%; height:100%; object-fit:cover; display:block; }
  .bgrow .bgmeta{ flex:1 1 170px; min-width:160px; }
  .bgrow input[type=text]{ width:100%; min-height:48px; padding:0 12px; border-radius:12px; border:3px solid var(--ink); font-family:inherit; font-size:1rem; font-weight:700; }
  .bgstate{ font-size:.82rem; color:var(--ink-soft); font-weight:600; margin-top:5px; }
  .status{ min-height:24px; font-weight:700; color:var(--lime); margin-top:12px; }
  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>

<script>
/* ================= storage adapter ================= */
const store = (function(){
  const art = (typeof window!=='undefined') && window.storage && typeof window.storage.get==='function';
  if(art) return {
    get:(k)=>window.storage.get(k,true), set:(k,v)=>window.storage.set(k,v,true),
    list:(p)=>window.storage.list(p,true), remove:(k)=>window.storage.delete(k,true) };
  return {
    async get(k){ const v=localStorage.getItem(k); if(v===null) throw new Error('nf'); return {key:k,value:v}; },
    async set(k,v){ localStorage.setItem(k,v); return {key:k,value:v}; },
    async list(p){ const keys=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(!p||k.startsWith(p)) keys.push(k);} return {keys}; },
    async remove(k){ localStorage.removeItem(k); return {key:k,deleted:true}; }
  };
})();

const ADMIN_PASSWORD='0616';
const BG_CONFIG_KEY='bgconfig_v1';
const ROUND_LIMIT=3;
const ROUND_PREFIX='roundstate_v1_';
const CANVAS_W=260, CANVAS_H=340;
const CHAR_FRACTION=1/16;
const BLANK='#F4F1E8';

/* ================= blobby character ================= */
const ARM_LEN=92, ARM_W=34;
const POSE_ANGLES={ attention:{l:8,r:8}, wide:{l:78,r:78}, cheer:{l:165,r:165}, onehand:{l:165,r:10} };
const POSES=[{id:'attention',name:'차렷'},{id:'wide',name:'팔벌려'},{id:'cheer',name:'만세'},{id:'onehand',name:'한손'},{id:'lying',name:'눕기'}];

function rot(px,py,cx,cy,d){ const r=d*Math.PI/180,c=Math.cos(r),s=Math.sin(r),dx=px-cx,dy=py-cy;
  return {x:cx+dx*c-dy*s, y:cy+dx*s+dy*c}; }
/* A limb is ONE continuous path: straight sides + a rounded far end (a capsule).
   Earlier this was a rectangle plus a separate overlapping circle, and where the
   two subpaths overlapped with opposite winding directions the fill rule
   cancelled out — a hole. A single closed path can never have that problem. */
/* A limb is ONE continuous capsule path (straight sides + a rounded far end).
   Every subpath in the final silhouette MUST wind the same direction (all
   clockwise here) — nonzero fill-rule only creates a "hole" when two
   overlapping shapes wind in OPPOSITE directions. The rectangle's point order
   has to mirror between the left/right side to keep that consistent (verified
   numerically), not just the arc's sweep flag. */
function limb(pivot,dx,len,w,angle){
  const rr=Math.abs(dx)/2;
  const flat=len-rr;
  const P = pivot;
  const outer = {x:P.x+dx, y:P.y};
  const outerFlat = {x:P.x+dx, y:P.y+flat};
  const innerFlat = {x:P.x, y:P.y+flat};
  let seq, endPt;
  if(dx<0){ seq=[P,outer,outerFlat]; endPt=innerFlat; }
  else{ seq=[P,innerFlat]; endPt=outerFlat; }
  const pts=seq.map(p=>rot(p.x,p.y,P.x,P.y,angle));
  const endR=rot(endPt.x,endPt.y,P.x,P.y,angle);
  if(dx<0){
    return `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)} L${pts[1].x.toFixed(1)},${pts[1].y.toFixed(1)} `+
           `L${pts[2].x.toFixed(1)},${pts[2].y.toFixed(1)} A${rr.toFixed(1)},${rr.toFixed(1)} 0 0,0 ${endR.x.toFixed(1)},${endR.y.toFixed(1)} Z`;
  }
  const outerR=rot(outer.x,outer.y,P.x,P.y,angle);
  return `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)} L${pts[1].x.toFixed(1)},${pts[1].y.toFixed(1)} `+
         `A${rr.toFixed(1)},${rr.toFixed(1)} 0 0,0 ${endR.x.toFixed(1)},${endR.y.toFixed(1)} L${outerR.x.toFixed(1)},${outerR.y.toFixed(1)} Z`;
}
function circlePath(cx,cy,r){
  return `M${(cx-r).toFixed(1)},${cy.toFixed(1)} a${r.toFixed(1)},${r.toFixed(1)} 0 1,0 ${(r*2).toFixed(1)},0 a${r.toFixed(1)},${r.toFixed(1)} 0 1,0 ${(-r*2).toFixed(1)},0 Z`;
}
function buildPosePath(id){
  if(id==='lying'){
    // lying flat, viewed from above: head + horizontal torso, arms out to the
    // sides, legs extended further along the body. Built from the same
    // clockwise-wound pieces as the standing poses, so it's just as hole-safe.
    const head=circlePath(42,180,38);
    const torso=limb({x:70,y:212}, 64, 85, 64, -90);
    const armUp=limb({x:100,y:180}, -26, 66, 26, 180);
    const armDown=limb({x:100,y:180}, 26, 66, 26, 0);
    const legUp=limb({x:150,y:150}, -22, 95, 22, -90);
    const legDown=limb({x:150,y:210}, 22, 95, 22, -90);
    return [head,torso,armUp,armDown,legUp,legDown].join(' ');
  }
  const a=POSE_ANGLES[id]||POSE_ANGLES.attention;
  const head='M130,26 a40,40 0 1,0 0.1,0 Z';
  const torso='M86,202 Q130,216 174,202 L168,84 Q130,72 92,84 Z';
  const armL=limb({x:96,y:96},-ARM_W,ARM_LEN,ARM_W,a.l);
  const armR=limb({x:164,y:96},ARM_W,ARM_LEN,ARM_W,-a.r);
  const legL=limb({x:126,y:196},-32,116,32,6);
  const legR=limb({x:134,y:196},32,116,32,-6);
  return [head,torso,armL,armR,legL,legR].join(' ');
}
function faceSVG(id){
  if(id==='lying'){
    return `<g><ellipse cx="30" cy="172" rx="5" ry="8" fill="#1D1B18"/><ellipse cx="54" cy="172" rx="5" ry="8" fill="#1D1B18"/>`
      + `<path d="M24,184 q17,16 34,0" fill="none" stroke="#1D1B18" stroke-width="5" stroke-linecap="round"/></g>`;
  }
  return `<g><ellipse cx="115" cy="52" rx="5.5" ry="9" fill="#1D1B18"/><ellipse cx="145" cy="52" rx="5.5" ry="9" fill="#1D1B18"/>`
    + `<path d="M107,66 q23,22 46,0" fill="none" stroke="#1D1B18" stroke-width="6" stroke-linecap="round"/></g>`;
}
function poseThumb(id){
  return `<svg viewBox="0 0 260 340"><path d="${buildPosePath(id)}" fill="#fff" stroke="#1D1B18" stroke-width="7" stroke-linejoin="round"/>${faceSVG(id)}</svg>`;
}

/* ================= backgrounds ================= */
/* BUILTIN are the shipped presets. The live list lives in bgList and is editable
   by the admin (add / delete / rename / replace image), persisted to storage. */
const BUILTIN=[
  {id:'brick', name:'벽돌벽', build:buildBrick},
  {id:'jungle',name:'정글',  build:buildJungle},
  {id:'desert',name:'사막',  build:buildDesert},
  {id:'ocean', name:'바닷속',build:buildOcean},
  {id:'space', name:'우주',  build:buildSpace}
];
function builtinOf(id){ return BUILTIN.find(b=>b.id===id); }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; } }
function buildBrick(){
  let b=''; const rnd=mulberry32(3);
  for(let r=0;r<12;r++){ const off=(r%2)?-40:0;
    for(let c=0;c<11;c++){ const x=off+c*76, y=r*50;
      const t=['#A8563E','#B4614A','#9C4E38','#BE6E55'][Math.floor(rnd()*4)];
      b+=`<rect x="${x+4}" y="${y+4}" width="68" height="42" rx="4" fill="${t}"/>`; } }
  return `<rect width="800" height="600" fill="#D9CFC2"/>${b}`;
}
function leaf(x,y,s,c){ return `<path d="M${x} ${y} C${x+s} ${y-s*.3} ${x+s} ${y+s*.3} ${x} ${y+s} C${x-s} ${y+s*.3} ${x-s} ${y-s*.3} ${x} ${y} Z" fill="${c}"/>`; }
function buildJungle(){
  return `<defs><linearGradient id="jg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#DCE9B8"/><stop offset="100%" stop-color="#4F7942"/></linearGradient></defs>
  <rect width="800" height="600" fill="url(#jg)"/><ellipse cx="120" cy="560" rx="220" ry="60" fill="#3E6534"/><ellipse cx="650" cy="570" rx="260" ry="70" fill="#3E6534"/>
  ${leaf(90,140,60,'#2F5A28')}${leaf(180,90,80,'#3E6534')}${leaf(650,100,90,'#2F5A28')}${leaf(730,210,55,'#3E6534')}${leaf(60,360,70,'#345E2C')}${leaf(400,70,65,'#2F5A28')}`;
}
function buildDesert(){
  return `<defs><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FCE3AE"/><stop offset="100%" stop-color="#E3A857"/></linearGradient></defs>
  <rect width="800" height="600" fill="url(#dg)"/><circle cx="680" cy="90" r="46" fill="#FBEFD0"/>
  <path d="M0 420 Q200 380 400 430 T800 410 V600 H0 Z" fill="#D9924B"/><path d="M0 480 Q220 450 420 490 T800 480 V600 H0 Z" fill="#C67F3B"/>
  <path d="M120 600 C100 520 130 500 150 600" fill="#5C7A3D"/><path d="M600 600 C580 530 610 510 630 600" fill="#5C7A3D"/>`;
}
function bub(x,y,r){ return `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity=".5"/>`; }
function buildOcean(){
  return `<defs><linearGradient id="og" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#A6D9E8"/><stop offset="100%" stop-color="#2E6E8E"/></linearGradient></defs>
  <rect width="800" height="600" fill="url(#og)"/>${bub(120,480,14)}${bub(160,410,8)}${bub(700,180,16)}${bub(660,240,9)}${bub(400,100,10)}${bub(300,500,12)}
  <path d="M50 580 C120 540 180 580 240 550 C300 520 360 570 420 550 C480 530 540 570 600 550 C660 530 720 570 780 550 V600 H50 Z" fill="#1F4E63"/>
  <ellipse cx="150" cy="550" rx="50" ry="18" fill="#E58FB1" opacity=".7"/><ellipse cx="620" cy="560" rx="60" ry="20" fill="#E58FB1" opacity=".6"/>`;
}
function buildSpace(){
  let s=''; const rnd=mulberry32(7);
  for(let i=0;i<70;i++) s+=`<circle cx="${(rnd()*800).toFixed(1)}" cy="${(rnd()*600).toFixed(1)}" r="${(1+rnd()*1.8).toFixed(2)}" fill="#fff" opacity="${(0.4+rnd()*0.6).toFixed(2)}"/>`;
  return `<defs><radialGradient id="sg" cx="50%" cy="30%" r="80%"><stop offset="0%" stop-color="#2B2559"/><stop offset="100%" stop-color="#0E0B26"/></radialGradient></defs>
  <rect width="800" height="600" fill="url(#sg)"/>${s}<circle cx="640" cy="160" r="70" fill="#7A5C9E"/>
  <ellipse cx="640" cy="160" rx="110" ry="18" fill="none" stroke="#B79FD1" stroke-width="6" opacity=".7"/><circle cx="130" cy="450" r="46" fill="#4A7A9D"/>`;
}

const PALETTE=['#FFFFFF','#1D1B18','#8C8C8C','#FF3E7F','#FF7A3C','#FFC93C','#8BE04A','#3FA84A','#3FC1F0','#2E6E8E','#9B6BE8','#A8563E'];

/* ================= bg config ================= */
/* bgList: [{ id, name, image? }] — image present means a custom photo.
   Entries whose id matches a BUILTIN and have no image render from the preset. */
let bgList=[];
function defaultList(){ return BUILTIN.map(b=>({ id:b.id, name:b.name })); }
async function loadBgConfig(){
  let raw=null;
  try{ const r=await store.get(BG_CONFIG_KEY); raw=(r&&r.value)?JSON.parse(r.value):null; }catch(e){ raw=null; }
  if(raw && Array.isArray(raw.list) && raw.list.length){
    bgList=raw.list.filter(e=>e&&e.id).map(e=>({ id:e.id, name:e.name||e.id, image:e.image }));
  }else if(raw && !Array.isArray(raw.list) && typeof raw==='object'){
    // migrate the older { id: {name,image} } shape
    bgList=defaultList().map(e=>{
      const o=raw[e.id]||{};
      return { id:e.id, name:o.name||e.name, image:o.image };
    });
  }else{
    bgList=defaultList();
  }
  if(!bgList.length) bgList=defaultList();
}
async function saveBgConfig(){ await store.set(BG_CONFIG_KEY, JSON.stringify({ list:bgList })); }
function bgEntry(id){ return bgList.find(b=>b.id===id); }
function bgName(id){ const e=bgEntry(id); if(e&&e.name) return e.name; const d=builtinOf(id); return d?d.name:id; }
function bgCustom(id){ const e=bgEntry(id); return !!(e&&e.image); }
function bgIsBuiltin(id){ return !!builtinOf(id); }
function bgLayerHTML(id){
  const e=bgEntry(id);
  if(e&&e.image) return `<img class="bg-layer" src="${e.image}" alt="">`;
  const d=builtinOf(id);
  if(!d) return `<div class="bg-layer" style="background:#CFC9B8"></div>`;
  return `<svg class="bg-layer" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${d.build()}</svg>`;
}
function bgSrc(id){
  const e=bgEntry(id);
  if(e&&e.image) return e.image;
  const d=builtinOf(id);
  const inner = d ? d.build() : '<rect width="800" height="600" fill="#CFC9B8"/>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">${inner}</svg>`);
}

/* ================= round state ================= */
async function getRound(id){
  try{ const r=await store.get(ROUND_PREFIX+id); if(r&&r.value){ const s=JSON.parse(r.value); if(typeof s.round==='number') return s; } }catch(e){}
  return {round:1,count:0};
}
async function setRound(id,s){ await store.set(ROUND_PREFIX+id, JSON.stringify(s)); }

/* ================= app state ================= */
let wizard={ backgroundId:null, pose:'wide', x:50, y:45 };
function showOnly(id){ ['home','wizard','admin-gate','admin-dash'].forEach(k=>{ document.getElementById(k).classList.toggle('hidden', k!==id); }); }
function goStep(s){ document.querySelectorAll('#wizard > section.step').forEach(x=>x.classList.remove('active')); document.getElementById('step-'+s).classList.add('active'); }

/* hero + title art */
(function(){
  const p=buildPosePath('wide');
  document.getElementById('hero-figure').innerHTML=
    `<defs><clipPath id="hc"><path d="${p}"/></clipPath></defs>
     <g clip-path="url(#hc)"><rect width="260" height="340" fill="#fff"/>
       <rect x="0" y="150" width="260" height="26" fill="#FF3E7F" opacity=".85"/>
       <rect x="0" y="186" width="260" height="26" fill="#FFC93C" opacity=".85"/>
       <rect x="0" y="222" width="260" height="26" fill="#8BE04A" opacity=".85"/>
       <rect x="0" y="258" width="260" height="26" fill="#3FC1F0" opacity=".85"/>
     </g><path d="${p}" fill="none" stroke="#1D1B18" stroke-width="7" stroke-linejoin="round"/>${faceSVG()}`;

  const cols=['#FF3E7F','#FFC93C','#8BE04A','#3FC1F0','#9B6BE8','#FF7A3C'];
  const l1='MEGA', l2='CHAMELEON';
  let out='';
  const w1=118, sx1=(620-l1.length*w1)/2;
  l1.split('').forEach((ch,i)=>{ const rotd=(i%2?4:-4);
    out+=`<g transform="translate(${sx1+i*w1+w1/2},62) rotate(${rotd})"><text x="0" y="0" text-anchor="middle" font-family="Gaegu,sans-serif" font-size="96" font-weight="700" fill="${cols[i%cols.length]}" stroke="#1D1B18" stroke-width="6" paint-order="stroke">${ch}</text></g>`; });

/* char-anchor (inside the zoomed viewport) and handle-anchor (outside it, so the
   handle stays a fixed on-screen size) always share the same % position, and
   the viewport zooms around that same point so the character never drifts. */
function applyPose(){ pc.style.clipPath=`path('${buildPosePath(wizard.pose)}')`; }

function setCharPosition(x,y){
  wizard.x=x; wizard.y=y;
  document.getElementById('char-anchor').style.left=x+'%';
  document.getElementById('char-anchor').style.top=y+'%';
  updateHandlePosition();
}

/* ---- pan + zoom model ----
   The viewport is transformed as translate(panX,panY) scale(zoom) with its
   origin at the top-left, so a point at world fraction (fx,fy) lands at
   screen px  pan + f * stageSize * zoom.  Inverting that lets a pinch keep
   whatever the fingers grabbed pinned under the fingers. */
function stageRect(){ return document.getElementById('create-stage').getBoundingClientRect(); }
function applyViewport(){
  clampPan();
  document.getElementById('stage-viewport').style.transform =
    `translate(${panX}px, ${panY}px) scale(${zoom})`;
  updateHandlePosition();
  setZoomLabel();
}
function clampPan(){
  const r=stageRect(); if(!r.width) return;
  // never let the scene pull away from the stage edges
  panX=Math.min(0, Math.max(r.width*(1-zoom), panX));
  panY=Math.min(0, Math.max(r.height*(1-zoom), panY));
}
/* screen point -> world fraction (0..1 across the background) */
function screenToWorld(clientX, clientY){
  const r=stageRect();
  return {
    fx: ((clientX-r.left)-panX)/(r.width*zoom),
    fy: ((clientY-r.top)-panY)/(r.height*zoom)
  };
}
/* world fraction -> screen px relative to the stage box */
function worldToStagePx(fx, fy){
  const r=stageRect();
  return { x: panX + fx*r.width*zoom, y: panY + fy*r.height*zoom };
}
function resetView(){ zoom=1; panX=0; panY=0; }

function updateScale(){
  const stage=document.getElementById('create-stage'), inner=document.getElementById('char-inner');
  const w=stage.getBoundingClientRect().width; if(!w) return;
  // The character lives inside the viewport, so the viewport's zoom already
  // magnifies it along with the background — this only sets its base size.
  const s=(w*CHAR_FRACTION)/CANVAS_W;
  inner.style.transform=`translate(-50%,-50%) scale(${s})`;
  applyViewport();
}

/* The handle sits OUTSIDE the zoomed viewport so it keeps a constant, easily
   tappable size — which means its position has to be projected manually. */
function updateHandlePosition(){
  const anchor=document.getElementById('handle-anchor');
  if(!anchor) return;
  const p=worldToStagePx(wizard.x/100, wizard.y/100);
  anchor.style.left=p.x+'px';
  anchor.style.top=p.y+'px';
  updateHandleSide(p.y);
}
function updateHandleSide(screenY){
  const inner=document.getElementById('char-inner');
  const handle=document.getElementById('drag-handle');
  if(!inner||!handle) return;
  if(screenY===undefined) screenY=worldToStagePx(wizard.x/100, wizard.y/100).y;
  const halfCharPx=inner.getBoundingClientRect().height/2; // already includes zoom
  const handleH=handle.getBoundingClientRect().height||38;
  const gap=8;
  if(screenY-halfCharPx < handleH+gap){
    handle.style.transform=`translate(-50%, ${(halfCharPx+gap).toFixed(0)}px)`;
  }else{
    handle.style.transform='translate(-50%,-160%)';
  }
}

/* Two-finger pinch: zooms around the MIDPOINT BETWEEN THE FINGERS (not the
   character) and pans with them, so whatever you grabbed stays under your
   fingers — the way photo apps behave. */
(function(){
  const stage=document.getElementById('create-stage');
  const active=new Map(); // pointerId -> {x,y}
  let pinching=false, startDist=0, startZoom=1, anchorWorld=null;
  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
  function mid(a,b){ return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }

  function beginPinch(){
    const pts=[...active.values()];
    const m=mid(pts[0],pts[1]);
    startDist=dist(pts[0],pts[1]);
    startZoom=zoom;
    anchorWorld=screenToWorld(m.x, m.y); // the world point pinned under the fingers
    pinching=true;
  }
  stage.addEventListener('pointerdown', e=>{
    active.set(e.pointerId, {x:e.clientX,y:e.clientY});
    if(active.size===2){
      drawing=false;          // cancel any single-finger stroke in progress
      e.stopPropagation();    // and don't let this finger start a new dab
      beginPinch();
    }
  }, true);
  stage.addEventListener('pointermove', e=>{
    if(!active.has(e.pointerId)) return;
    active.set(e.pointerId, {x:e.clientX,y:e.clientY});
    if(!pinching || active.size!==2 || !anchorWorld) return;
    e.preventDefault();
    const pts=[...active.values()];
    const m=mid(pts[0],pts[1]);
    if(startDist>0) zoom=Math.max(1, Math.min(8, startZoom*(dist(pts[0],pts[1])/startDist)));
    // keep anchorWorld under the current finger midpoint
    const r=stageRect();
    panX=(m.x-r.left)-anchorWorld.fx*r.width*zoom;
    panY=(m.y-r.top) -anchorWorld.fy*r.height*zoom;
    applyViewport();
  }, true);
  function release(e){
    active.delete(e.pointerId);
    if(active.size<2){ pinching=false; anchorWorld=null; }
    if(active.size===2) beginPinch(); // re-anchor if a third finger lifted
  }
  stage.addEventListener('pointerup', release, true);
  stage.addEventListener('pointercancel', release, true);
})();

/* painting (pointer events cover Apple Pencil + finger) */
function cpos(e){
  const r=pc.getBoundingClientRect();
  return { x:(e.clientX-r.left)*(pc.width/r.width), y:(e.clientY-r.top)*(pc.height/r.height) };
}
function col(){ return eraser?BLANK:brush; }
document.getElementById('paint-canvas').addEventListener('pointerdown',e=>{
  if(eyedrop) return; // sampling a colour, not painting
  e.preventDefault(); drawing=true; const p=cpos(e); lx=p.x; ly=p.y;
  ctx.fillStyle=col(); ctx.beginPath(); ctx.arc(p.x,p.y,bsize/2,0,7); ctx.fill();
  e.target.setPointerCapture(e.pointerId);
});
document.getElementById('paint-canvas').addEventListener('pointermove',e=>{
  if(!drawing) return; e.preventDefault(); const p=cpos(e);
  ctx.strokeStyle=col(); ctx.lineWidth=bsize; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p.x,p.y); ctx.stroke(); lx=p.x; ly=p.y;
});
window.addEventListener('pointerup',()=>{ drawing=false; });

/* eyedropper */
document.getElementById('eyedrop-btn').addEventListener('click',()=>{

document.getElementById('create-stage').addEventListener('click', eyedropClick, true);
function eyedropClick(e){
  if(!eyedrop||!bgRaster) return;
  // Convert through the pan/zoom transform rather than the element's own box,
  // so sampling stays accurate at any zoom level and pan offset.
  const f=screenToWorld(e.clientX, e.clientY);
  const x=Math.floor(f.fx*800), y=Math.floor(f.fy*600);
  try{
    const d=bgRaster.getImageData(Math.max(0,Math.min(799,x)),Math.max(0,Math.min(599,y)),1,1).data;
    setBrush('#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join(''));
  }catch(err){}
  eyedrop=false;
  document.getElementById('eyedrop-btn').classList.remove('on');
  document.getElementById('create-stage').classList.remove('eyedrop');
}

/* drag */
function makeDraggable(){
  const h0=document.getElementById('drag-handle');
  const h=h0.cloneNode(true); h0.parentNode.replaceChild(h,h0);
  let dg=false, ox=0, oy=0;
  h.addEventListener('pointerdown',e=>{
    e.preventDefault(); dg=true;
    const f=screenToWorld(e.clientX, e.clientY);
    ox=wizard.x-f.fx*100;
    oy=wizard.y-f.fy*100;
    h.setPointerCapture(e.pointerId);
  });
  h.addEventListener('pointermove',e=>{
    if(!dg) return; e.preventDefault();
    const f=screenToWorld(e.clientX, e.clientY);
    let x=f.fx*100+ox, y=f.fy*100+oy;
    x=Math.max(4,Math.min(96,x)); y=Math.max(6,Math.min(96,y));
    setCharPosition(x,y);
  });
  h.addEventListener('pointerup',()=>{ dg=false; });
  h.addEventListener('pointercancel',()=>{ dg=false; });
}

/* ================= PNG export ================= */
const EX_W=1600, EX_H=1200;
function loadImg(src){
  return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('img')); i.src=src; });
}
function drawCover(c,img,x,y,w,h){
  const s=Math.max(w/img.width,h/img.height), dw=img.width*s, dh=img.height*s;
  c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip();
  c.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh); c.restore();
}
async function drawScene(c, bgId, ox, oy, w, h, withNames){
  const bg=await loadImg(bgSrc(bgId));
  drawCover(c,bg,ox,oy,w,h);
  const list=data[bgId]||[];
  const cw=w*CHAR_FRACTION, ch=cw*(CANVAS_H/CANVAS_W);
  for(const r of list){
    try{
      const im=await loadImg(r.paintedImage);
      const cx=ox+(r.x/100)*w, cy=oy+(r.y/100)*h;
      c.drawImage(im, cx-cw/2, cy-ch/2, cw, ch);
      if(withNames){
        c.beginPath(); c.arc(cx,cy,Math.max(cw,ch)*0.8,0,7);
        c.strokeStyle='#FFC93C'; c.lineWidth=Math.max(2,w/300); c.stroke();
        const label=r.name||'이름 없음';
        const fs=Math.max(13,w/48);
        c.font='700 '+fs+'px sans-serif'; c.textAlign='center'; c.textBaseline='middle';
        const tw=c.measureText(label).width, ly=cy+Math.max(cw,ch)*0.8+fs;
        c.fillStyle='rgba(0,0,0,.72)';
        c.fillRect(cx-tw/2-8, ly-fs*0.7, tw+16, fs*1.4);
        c.fillStyle='#fff'; c.fillText(label,cx,ly);
      }
    }catch(e){}
  }
}
function downloadCanvas(cv,name){
  cv.toBlob(b=>{
    const url=URL.createObjectURL(b);
    const a=document.createElement('a');
    a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  },'image/png');
}
function pngStatus(m,err){ const e=document.getElementById('png-status'); e.textContent=m; e.style.color=err?'var(--hot)':'var(--ink)'; }
function stamp(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}
async function exportOne(withNames){
  const list=data[curBg]||[];
  if(!list.length){ pngStatus('이 배경엔 아직 아무도 없어요.',true); return; }
  pngStatus('사진 만드는 중...');
  try{
    const cv=document.createElement('canvas'); cv.width=EX_W; cv.height=EX_H;
    const c=cv.getContext('2d');
    await drawScene(c,curBg,0,0,EX_W,EX_H,withNames);
    downloadCanvas(cv,`MEGA_${bgName(curBg)}_${stamp()}.png`);
    pngStatus(`${bgName(curBg)} 사진을 저장했어요 (${list.length}명).`);
  }catch(e){ pngStatus('사진 저장에 실패했어요.',true); }
}
async function exportAll(){
  const used=bgList.filter(b=>(data[b.id]||[]).length);
  if(!used.length){ pngStatus('아직 아무도 숨지 않았어요.',true); return; }
  pngStatus('사진 만드는 중...');
  try{
    const cols=used.length>1?2:1, rows=Math.ceil(used.length/cols);
    const cellW=800, cellH=600, pad=16, labelH=44;
    const cv=document.createElement('canvas');
    cv.width=cols*cellW+pad*(cols+1);
    cv.height=rows*(cellH+labelH)+pad*(rows+1);
    const c=cv.getContext('2d');
    c.fillStyle='#F2EFE6'; c.fillRect(0,0,cv.width,cv.height);
    for(let i=0;i<used.length;i++){
      const bx=pad+(i%cols)*(cellW+pad), by=pad+Math.floor(i/cols)*(cellH+labelH+pad);
      await drawScene(c,used[i].id,bx,by,cellW,cellH,true);
      c.strokeStyle='#1D1B18'; c.lineWidth=4; c.strokeRect(bx,by,cellW,cellH);
      c.fillStyle='#1D1B18'; c.font='700 26px sans-serif'; c.textAlign='left'; c.textBaseline='middle';
      c.fillText(`${bgName(used[i].id)} · ${(data[used[i].id]||[]).length}명`, bx+4, by+cellH+labelH/2);
    }
    downloadCanvas(cv,`MEGA_전체_${stamp()}.png`);
    pngStatus('전체 배경을 한 장으로 저장했어요.');
  }catch(e){ pngStatus('사진 저장에 실패했어요.',true); }
}
document.getElementById('save-png').addEventListener('click',()=>exportOne(false));
document.getElementById('save-png-named').addEventListener('click',()=>exportOne(true));
document.getElementById('save-png-all').addEventListener('click',exportAll);

/* background manager */
function status(m,err){ const e=document.getElementById('bg-status'); e.textContent=m; e.style.color=err?'var(--hot)':'var(--ink)'; }
function renderBgMan(){
  const w=document.getElementById('bg-manage-list'); w.innerHTML='';
  bgList.forEach(bg=>{
    const custom=bgCustom(bg.id), builtin=bgIsBuiltin(bg.id);
    const n=(data[bg.id]||[]).length;
    const d=document.createElement('div'); d.className='bgrow';
    d.innerHTML=`<div class="bgthumb">${bgLayerHTML(bg.id)}</div>
      <div class="bgmeta"><input type="text" value="${bgName(bg.id)}" data-name="${bg.id}">
      <div class="bgstate">${custom?'올린 사진':'기본 배경'}${n?` · ${n}명 숨어있음`:''}</div></div>
      <div class="toolrow"><button class="toolbtn" data-up="${bg.id}">사진 바꾸기</button>
      ${builtin?`<button class="toolbtn" data-reset="${bg.id}" ${custom?'':'disabled'}>기본으로</button>`:''}
      <button class="toolbtn" data-del="${bg.id}">삭제</button></div>
      <input type="file" accept="image/*" class="hidden" data-file="${bg.id}">`;
    w.appendChild(d);
  });

  const add=document.createElement('div');
  add.className='bgrow';
  add.style.justifyContent='center';
  add.innerHTML=`<button class="toolbtn" id="bg-add" style="min-width:220px;">＋ 배경 추가</button>
    <input type="file" accept="image/*" class="hidden" id="bg-add-file">`;
  w.appendChild(add);

  w.querySelectorAll('[data-up]').forEach(b=>b.addEventListener('click',()=>w.querySelector(`[data-file="${b.dataset.up}"]`).click()));
  w.querySelectorAll('[data-file]').forEach(i=>i.addEventListener('change',e=>{ upload(i.dataset.file,e.target.files[0]); e.target.value=''; }));
  w.querySelectorAll('[data-reset]').forEach(b=>b.addEventListener('click',()=>resetBg(b.dataset.reset)));
  w.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>removeBg(b.dataset.del)));
  w.querySelectorAll('[data-name]').forEach(i=>i.addEventListener('change',()=>rename(i.dataset.name,i.value.trim())));
  document.getElementById('bg-add').addEventListener('click',()=>document.getElementById('bg-add-file').click());
  document.getElementById('bg-add-file').addEventListener('change',e=>{ addBg(e.target.files[0]); e.target.value=''; });
}
function processImg(f){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=()=>rej(new Error('read'));
    r.onload=()=>{
      const im=new Image();
      im.onerror=()=>rej(new Error('img'));
      im.onload=()=>{
        const W=960,H=720, cv=document.createElement('canvas'); cv.width=W; cv.height=H;
        const c=cv.getContext('2d');
        const s=Math.max(W/im.width,H/im.height), dw=im.width*s, dh=im.height*s;
        c.drawImage(im,(W-dw)/2,(H-dh)/2,dw,dh);
        res(cv.toDataURL('image/jpeg',0.82));
      };
      im.src=r.result;
    };
    r.readAsDataURL(f);
  });
}
async function refreshAfterBgChange(msg){
  await saveBgConfig();
  buildAdminTabs();
  renderBgMan();
  renderAdmin();
  status(msg);
}
async function addBg(f){
  if(!f) return;
  if(!f.type.startsWith('image/')){ status('사진만 올릴 수 있어요.',true); return; }
  status('사진 처리 중...');
  try{
    const img=await processImg(f);
    const id='bg_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    let n=1; const taken=new Set(bgList.map(b=>b.name));
    while(taken.has('새 배경 '+n)) n++;
    bgList.push({ id, name:'새 배경 '+n, image:img });
    data[id]=[];
    curBg=id;
    await refreshAfterBgChange('배경을 추가했어요. 이름을 바꿔보세요.');
  }catch(e){ status('추가 실패. 더 작은 사진으로 해보세요.',true); }
}
async function removeBg(id){
  if(bgList.length<=1){ status('배경은 최소 1개는 있어야 해요.',true); return; }
  const n=(data[id]||[]).length;
  const msg = n
    ? `"${bgName(id)}" 배경을 삭제할까요?\n여기 숨어있는 ${n}명의 기록도 함께 지워지고 되돌릴 수 없어요.`
    : `"${bgName(id)}" 배경을 삭제할까요?`;
  if(!confirm(msg)) return;
  status('삭제하는 중...');
  try{
    for(const r of (data[id]||[])){ try{ await store.remove(r.id); }catch(e){} }
    try{ await store.remove(ROUND_PREFIX+id); }catch(e){}
    delete data[id];
    bgList=bgList.filter(b=>b.id!==id);
    if(curBg===id) curBg=bgList.length?bgList[0].id:null;
    await refreshAfterBgChange('배경을 삭제했어요.');
  }catch(e){ status('삭제 실패',true); }
}
async function upload(id,f){
  if(!f) return;
  if(!f.type.startsWith('image/')){ status('사진만 올릴 수 있어요.',true); return; }
  status('사진 처리 중...');
  try{
    const d=await processImg(f);
    const e=bgEntry(id); if(e) e.image=d;
    await refreshAfterBgChange(bgName(id)+' 배경 사진을 바꿨어요.');
  }catch(e){ status('저장 실패. 더 작은 사진으로 해보세요.',true); }
}
async function resetBg(id){
  const e=bgEntry(id); if(e) delete e.image;
  try{ await refreshAfterBgChange(bgName(id)+' 기본 배경으로 되돌렸어요.'); }
  catch(err){ status('저장 실패',true); }
}
async function rename(id,n){
  if(!n){ status('이름은 비울 수 없어요.',true); renderBgMan(); return; }
  const e=bgEntry(id); if(e) e.name=n;
  try{ await refreshAfterBgChange('이름을 바꿨어요.'); }
  catch(err){ status('저장 실패',true); }
}

/* stop iPad double-tap zoom / pull-to-refresh on the stage */
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

showOnly('home');
</script>
